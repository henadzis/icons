<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Сглаженный квадратный фон (squircle) -->
  <rect width="512" height="512" rx="120" fill="#0f172a" />
  
  <!-- Градиент для неонового свечения -->
  <defs>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" /> <!-- Светло-индиго -->
      <stop offset="100%" stop-color="#c084fc" /> <!-- Светло-фиолетовый -->
    </linearGradient>
  </defs>
  
  <!-- Идеально гладкий контур геймпада -->
  <path d="M112 176c-35 0-64 29-64 64v80c0 44 36 80 80 80h16c19 0 36-12 43-29l21-51h96l21 51c7 17 24 29 43 29h16c44 0 80-36 80-80v-80c0-35-29-64-64-64H112z" fill="none" stroke="url(#neonGradient)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Минималистичная крестовина (D-Pad) слева -->
  <path d="M144 264h48M168 240v48" stroke="#818cf8" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- 4 кнопки действий справа -->
  <circle cx="344" cy="264" r="14" fill="#c084fc" />
  <circle cx="376" cy="232" r="14" fill="#c084fc" />
  <circle cx="376" cy="296" r="14" fill="#c084fc" />
  <circle cx="408" cy="264" r="14" fill="#c084fc" />
</svg>